on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  kicad_sch: "./hardware/ledstrip/ledstrip.kicad_sch"
  kicad_pcb: "./hardware/ledstrip/ledstrip.kicad_pcb"

jobs:
  kicad_erc:
    runs-on: ubuntu-latest
    name: Run KiCad ERC checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KiCad ERC
        id: erc
        uses: sparkengineering/kicad-action@v4
        if: '!cancelled()'
        with:
          kicad_sch: ${{ env.kicad_sch }}
          sch_erc: true

      # Upload ERC report only if ERC failed
      - name: Upload ERC report
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.erc.conclusion == 'failure' }}
        with:
          name: erc.rpt
          path: ${{ github.workspace }}/hardware/ledstrip/erc.rpt

  kicad_drc:
    runs-on: ubuntu-latest
    name: Run KiCad DRC checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run KiCad DRC
        id: drc
        uses: sparkengineering/kicad-action@v4
        if: '!cancelled()'
        with:
          kicad_pcb: ${{ env.kicad_pcb }}
          pcb_drc: true

      # Upload DRC report only if DRC failed
      - name: Upload DRC report
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.drc.conclusion == 'failure' }}
        with:
          name: drc.rpt
          path: ${{ github.workspace }}/hardware/ledstrip/drc.rpt

  kicad_export:
    runs-on: ubuntu-latest
    name: My KiCad job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export production files
        id: production
        uses: sparkengineering/kicad-action@v4
        if: '!cancelled()'
        with:
          kicad_sch: ${{ env.kicad_sch }}
          sch_pdf: true # Generate PDF
          sch_bom: true # Generate BOM
          kicad_pcb: ${{ env.kicad_pcb }}
          pcb_gerbers: true # Generate Gerbers

      # Upload production files only if generation succeeded
      - name: Upload production files
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.production.conclusion == 'success' }}
        with:
          name: Production files
          path: |
            ${{ github.workspace }}/hardware/ledstrip/sch.pdf
            ${{ github.workspace }}/hardware/ledstrip/bom.csv
            ${{ github.workspace }}/hardware/ledstrip/gbr.zip
